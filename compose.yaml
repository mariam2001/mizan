services:
  postgresdb:
    image: postgres:16-alpine
    container_name: spring-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mariam
      POSTGRES_PASSWORD: mariam123
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
